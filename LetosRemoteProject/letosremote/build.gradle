plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
    id 'signing'
}

android {
    namespace 'org.letos.letosremote'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

}

group = 'org.letos'
version = '1.3.0'

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

def isLocalPublish = gradle.startParameter.taskNames.any { it.contains('publishToMavenLocal') }

mavenPublishing {
    publishToMavenCentral('S01')
    coordinates(
            'org.letos',
            'letosremote',
            version
    )

    pom {
        name = 'Letos Remote'
        description = 'Android library for communicating with Letos'
        url = 'https://github.com/pawelsalawa/letos'

        licenses {
            license {
                name = 'GNU General Public License v3.0'
                url = 'https://www.gnu.org/licenses/gpl-3.0.html'
            }
        }

        developers {
            developer {
                id = 'pawelsalawa'
                name = 'Pawel Salawa'
                url = 'https://github.com/pawelsalawa'
            }
        }

        scm {
            url = 'https://github.com/pawelsalawa/letos-android'
            connection = 'scm:git:https://github.com/pawelsalawa/letos-android.git'
            developerConnection = 'scm:git:ssh://git@github.com/pawelsalawa/letos-android.git'
        }
    }

    mavenCentral {
        username = providers.environmentVariable('MAVEN_CENTRAL_USERNAME').orNull
        password = providers.environmentVariable('MAVEN_CENTRAL_PASSWORD').orNull
    }

    if (!isLocalPublish) {
        signAllPublications()
    }
}

if (!isLocalPublish) {
    signing {
        useInMemoryPgpKeys(
                providers.environmentVariable('SIGNING_KEY').orNull,
                providers.environmentVariable('SIGNING_PASSWORD').orNull
        )
        sign publishing.publications
    }
}
